/* Layout: one console screen centred on a dark "CRT" ground; touch pad pinned to the bottom on phones. */
:root{
  --bg:#0b0b1a; --bezel:#1a1c3a; --fg:#f8f8f0; --accent:#f89838; --dim:#7c7c8c;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--pixel);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
#screen{display:block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
body.touch #pad{display:flex}
.grp{display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.btn{width:68px;height:68px;border-radius:50%;border:3px solid #000;background:rgba(58,63,122,.78);
  color:var(--fg);font:12px/1 var(--pixel);display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 4px 0 #000;padding:0}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 #000;background:rgba(248,152,56,.85);color:#0b0b1a}
.btn.jump{width:84px;height:84px;background:rgba(216,56,56,.8)}
.btn.small{width:52px;height:40px;border-radius:10px;font-size:9px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.arrow{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent}
.arrow.l{border-right:16px solid currentColor}.arrow.r{border-left:16px solid currentColor}
</style>

</head>

function spr(rows,outline=true,swap){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const at=(i,j)=>(rows[j]&&rows[j][i])||".";
  const mk=flip=>{const c=document.createElement("canvas");c.width=w+2;c.height=h+2;const x=c.getContext("2d");
    for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
      let ch=at(i,j);const px=flip?(w-1-i)+1:i+1;
      if(ch==="."){if(outline&&(at(i-1,j)!=="."||at(i+1,j)!=="."||at(i,j-1)!=="."||at(i,j+1)!==".")){x.fillStyle=PAL.K;x.fillRect(px,j+1,1,1);}continue;}
      if(swap&&swap[ch])ch=swap[ch];x.fillStyle=PAL[ch];x.fillRect(px,j+1,1,1);}
    return c;};
  return {r:mk(false),l:mk(true),w,h};
}

function moveX(e,dx){e.x+=dx;const r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS);
  if(dx>0){const c=Math.floor((e.x+e.w-.01)/TS);for(let r=r0;r<=r1;r++)if(solid(c,r)){e.x=c*TS-e.w;return true;}}
  else if(dx<0){const c=Math.floor(e.x/TS);for(let r=r0;r<=r1;r++)if(solid(c,r)){e.x=(c+1)*TS;return true;}}
  return false;}
function moveY(e,dy){e.y+=dy;const c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS);
  if(dy>0){const r=Math.floor((e.y+e.h-.01)/TS);for(let c=c0;c<=c1;c++)if(solid(c,r)){e.y=r*TS-e.h;e.vy=0;e.onGround=true;return null;}}
  else if(dy<0){const r=Math.floor(e.y/TS),hits=[];for(let c=c0;c<=c1;c++)if(solid(c,r))hits.push(c);
    if(hits.length){e.y=(r+1)*TS;e.vy=0;return {r,hits};}}
  return null;}

  for(const e of ents)if(!e.dead&&e.active&&Math.abs(e.y+e.h-r*TS)<2&&e.x+e.w>c*TS&&e.x<c*TS+TS){e.dead=40;e.flip=true;e.vy=-3;addScore(100,e.x,e.y);SFX.stomp();}

function updPlayer(){

  else if(sp&&id===3&&jumpEdge&&!P.onGround&&P.airJ>0){ // PULO TRIPLO: mais dois pulos no ar
    P.airJ--;P.vy=-C.jump*.95;P.jbuf=0;tone(500,1000,.1);for(let i=0;i<6;i++)parts.push({x:P.x+6,y:P.y+P.h,vx:(i-2.5)*.5,vy:.5,t:14,col:i%2?"p":"W"});}

    P.barkT=40;items.push({type:"wave",x:P.x+(P.face>0?P.w:-8),y:P.y-2,w:8,h:16,vx:4*P.face,t:45});SFX.bark();}

    P.vy=P.vy<-2.4?P.vy+C.hold:Math.max(-2.4,P.vy-.45);if(P.y<-20){P.y=-20;P.vy=Math.max(P.vy,0);}

  else{P.vy+=(P.vy<0&&inp.j)?C.hold:.8;if(P.vy>6)P.vy=6;}

  P.prevB=P.y+P.h;
  if(moveX(P,P.vx))P.vx=0;

  if(P.vy>=0)for(const m of plats){

  if(P.onGround)combo=0;
  if(sp&&id===2&&wasAir&&P.onGround&&fallV>3)quake();
  if(turbo&&P.onGround&&Math.abs(P.vx)>2.5&&frameT%2===0)parts.push({x:P.x+(P.vx>0?0:12),y:P.y+12,vx:-Math.sign(P.vx)*.8,vy:-.3,t:10,col:"W"});
  if(P.sup>0){if(--P.sup===0){tone(660,220,.3,"square",.05);pops.push({x:P.x-8,y:P.y-12,t:50,s:"FIM DO "+C.sup});}
    else if(P.sup<120&&P.sup%30===0)tone(880,880,.04,"square",.04);}
  P.anim=P.onGround&&Math.abs(P.vx)>.3?P.anim+Math.abs(P.vx)*.08:0;
  if(P.inv>0)P.inv--;
  if(P.y>rows*TS+8)die(true);}

let allyN=0;
function updEnts(){
  const frozen=P&&P.sup>0&&G.char===5; // CONGELAR: inimigos param
  for(const e of ents){e.frozen=false;
    if(e.dead){if(--e.dead<=0)e.gone=true;if(e.flip){e.vy+=.3;e.y+=e.vy;if(e.vx)e.x+=e.vx*.5;}continue;}
    if(!e.active){if(e.x<G.cam+W+24)e.active=true;else continue;}
    if(frozen){e.frozen=true;continue;}
    if(e.type==="vac"&&CH().robot){ // aliado: segue o Parafuso
      const k=(e.allyIdx=e.allyIdx??(allyN++)),tx=P.x-P.face*(22+k%4*14);const d=tx-e.x;
      e.vx=Math.abs(d)<4?0:Math.max(-1.7,Math.min(1.7,d*.06));e.ally=true;}
    e.vy=Math.min(6,e.vy+.5);
    if(moveX(e,e.vx))e.vx=-e.vx;
    e.onGround=false;moveY(e,e.vy);
    if(e.type==="cat"&&e.onGround){const ax=e.vx>0?e.x+e.w+1:e.x-1;if(!solid(Math.floor(ax/TS),Math.floor((e.y+e.h+2)/TS)))e.vx=-e.vx;}
    if(e.y>rows*TS+32)e.gone=true;}
  ents=ents.filter(e=>!e.gone);}

function updItems(){
  for(const it of items){

      if(overlap(P,it)){it.gone=true;addBones(1);addScore(10);SFX.bone();puff(it.x+6,it.y+4,"W",4);}}
    else if(it.type==="wave"){it.x+=it.vx;if(--it.t<=0||solid(Math.floor((it.x+4)/TS),Math.floor((it.y+8)/TS)))it.gone=true;

    else if(it.type==="rock"){if(it.warn>0){it.warn--;continue;}
      it.vy=Math.min(7,it.vy+.35);it.y+=it.vy;

    else if(it.type==="bolt"){it.x+=it.vx;if(--it.t<=0||solid(Math.floor((it.x+4)/TS),Math.floor((it.y+3)/TS)))it.gone=true;
      else if(overlap(P,it)){it.gone=true;hurt();}}
    else if(it.type==="pop"){it.y-=1.4;if(--it.t<=0){it.gone=true;puff(it.x+6,it.y+4,"y",5);}}
    else if(it.type==="treat"){

      if(overlap(P,it)){it.gone=true;SFX.power();if(P.sup>0){P.sup=SUPER_TIME;addScore(1000,it.x,it.y);}
        else if(P.power){P.sup=SUPER_TIME;addScore(1000);pops.push({x:P.x-16,y:P.y-14,t:80,s:"SUPER "+CH().sup+"!"});seq([523,659,784,1047,784,1047,1319,1568],.07);}
        else{P.power=true;addScore(500);pops.push({x:P.x-16,y:P.y-14,t:70,s:CH().form+"!"});}puff(it.x+6,it.y+6,"y",10);}}}
  items=items.filter(i=>!i.gone);}

function collide(){
  for(const e of ents){if(e.dead||!e.active||!overlap(P,e))continue;
    if(CH().robot){if(e.type==="vac")continue;
      e.dead=1;e.gone=true;addScore(200,e.x,e.y-8);pops.push({x:e.x-4,y:e.y-18,t:40,s:"NHAC!"});tone(300,90,.12,"square",.1);tone(120,60,.1,"triangle",.1,.08);
      for(let i=0;i<8;i++)parts.push({x:e.x+6,y:e.y+6,vx:(P.x-e.x)*.05+(Math.random()-.5),vy:-Math.random()*2,t:14,col:i%2?"q":"Q"});continue;}
    if(e.frozen){e.dead=40;e.flip=true;e.vy=-3;addScore(200,e.x,e.y-8);tone(1400,700,.12,"triangle",.08);
      for(let i=0;i<8;i++)parts.push({x:e.x+6,y:e.y+4,vx:(Math.random()-.5)*3,vy:-Math.random()*3,t:22,col:i%2?"b":"W"});continue;}
    if(P.sup>0&&G.char===1){e.dead=40;e.flip=true;e.vy=-4;e.vx=P.vx;addScore(200,e.x,e.y-8);SFX.stomp();puff(e.x+6,e.y+6,"y",6);continue;}
    if(P.vy>0&&(P.prevB<=e.y+6||P.y+P.h<=e.y+e.h/2+3)){
      e.dead=30;e.flip=false;combo++;const pts=100*Math.min(8,1<<(combo-1));addScore(pts,e.x,e.y-8);
      P.vy=held().j?-6.5:-4;P.y=e.y-P.h;SFX.stomp();puff(e.x+e.w/2,e.y+e.h,"W",6);}
    else hurt();}}
function hurt(){if(P.inv>0)return;if(P.power){P.power=false;P.sup=0;P.inv=100;SFX.hurt();puff(P.x+6,P.y+6,"r",8);}else die(false);}
function die(pit){if(G.state!=="play")return;G.state="dying";G.stateT=110;P.vy=pit?0:-5;P.vx=0;P.power=false;P.sup=0;P.pit=pit;SFX.die();}

function updPlats(){for(const m of plats){const ph=Math.sin(frameT*2*Math.PI/m.per)*m.A;
  const nx=m.kind==="h"?m.x0+ph:m.x0,ny=m.kind==="v"?m.y0+ph:m.y0;m.dx=nx-m.x;m.dy=ny-m.y;m.x=nx;m.y=ny;}}
function updCam(){const max=cols*TS-W;G.cam=Math.round(Math.max(0,Math.min(max,P.x+P.w/2-W*.45)));}
function updFx(){for(const p of parts){p.vy+=.15;p.x+=p.vx;p.y+=p.vy;p.t--;}parts=parts.filter(p=>p.t>0);
  for(const p of pops){p.y-=.5;p.t--;}pops=pops.filter(p=>p.t>0);
  for(const k in bumps)if(--bumps[k]<=0)delete bumps[k];}

function update(){
  const st=G.state;G.stateT>0&&G.stateT--;if(G.shake>0)G.shake--;
  if(st==="title"){
    // Código secreto na tela inicial: ← ← → → ← → ← → (setas, A/D ou botões de toque) libera todos os cães
    if(leftEdge||rightEdge){G.code=(G.code+(leftEdge?"L":"R")).slice(-8);
      if(G.code===SECRET){G.code="";const n=[3,4,5,6].filter(i=>unlock(i)).length;G.secretT=150;G.secretMsg=n?"TODOS OS CÃES LIBERADOS!":"JÁ ESTÁ TUDO LIBERADO";SFX.life();}}
    if(G.secretT>0)G.secretT--;
    if(enterEdge||jumpEdge){SFX.bark();G.state="select";G.stateT=12;}}
  else if(st==="select"){
    if(leftEdge){G.char=(G.char+NCH-1)%NCH;tone(660,660,.05);}
    if(rightEdge){G.char=(G.char+1)%NCH;tone(660,660,.05);}
    if(upEdge){G.char=(G.char+NCH-3)%NCH;tone(660,660,.05);}
    if(downEdge){G.char=(G.char+3)%NCH;tone(660,660,.05);}
    if(confirmEdge&&G.stateT<=0){if(unlocked[G.char]){SFX.bark();G.state="mode";G.stateT=10;}else tone(160,120,.15,"square",.08);}}
  else if(st==="mode"){
    if(upEdge||leftEdge){G.diff=(G.diff+3)%4;tone(660,660,.05);}
    if(downEdge||rightEdge){G.diff=(G.diff+1)%4;tone(660,660,.05);}
    if(escEdge){G.state="select";G.stateT=10;}
    else if(confirmEdge&&G.stateT<=0){SFX.bark();newGame();}}
  else if(st==="card"){if(--G.cardT<=0)G.state="play";}
  else if(st==="pause"){
    if(navEdge){G.pauseSel=1-G.pauseSel;tone(660,660,.05);}
    else if(confirmEdge){if(G.pauseSel===0){G.state="play";SFX.pause();}else{G.state="title";G.stateT=15;SFX.pause();}}}
  else if(st==="play"){
    if(enterEdge){G.state="pause";G.pauseSel=0;SFX.pause();}
    else{frameT++;updPlats();updEnts();updPlayer();if(G.state==="play"){updItems();collide();updBoss();}crumbleStep();
      updFx();updCam();
      if(G.state==="play"){if(++G.t>=60){G.t=0;G.time--;if(G.time<=0){G.time=0;die(false);}}
        if(house&&P.x+P.w>house.x+10&&P.x<house.x+22&&P.y+P.h>house.y+10){G.state="clear";G.stateT=60;P.vx=0;SFX.clear();}}}}
  else if(st==="dying"){if(!P.pit){P.vy+=.3;P.y+=P.vy;}updFx();if(boss&&boss.dying)updBoss();
    if(G.stateT<=0){G.lives--;if(G.lives<=0){G.state="over";G.stateT=40;}else toCard(G.level,false);}}
  else if(st==="clear"){
    updFx();if(house){if(P.x<house.x+10)P.x+=.8;if(P.x>house.x+10)P.x-=.8;P.hidden=G.stateT<30;}
    if(G.time>0){if(G.stateT<=0){const d=Math.min(3,G.time);G.time-=d;addScore(10*d);if(G.time%9===0)tone(880,880,.03,"square",.03);}}
    else if(G.stateT<=-50){const n=G.level;
      if(n<lastLevel())toCard(n+1,true);else{G.state="win";G.stateT=40;SFX.life();G.newUnlock=unlock(3+G.diff)?3+G.diff:-1;}}
    if(G.time<=0&&G.stateT>-60)G.stateT--;}
  else if(st==="over"){if((enterEdge||jumpEdge)&&G.stateT<=0)newGame();}
  else if(st==="win"){updFx();if((enterEdge||jumpEdge)&&G.stateT<=0){G.state="title";G.stateT=20;G.newUnlock=-1;}}
  jumpEdge=false;enterEdge=false;leftEdge=false;rightEdge=false;navEdge=false;confirmEdge=false;upEdge=false;downEdge=false;escEdge=false;}

function band(y0,y1,a,b){for(let y=y0;y<y1;y+=2)R2(0,y,W,1,b);}

  }else{
    R2(0,0,W,H,"K");R2(0,150,W,H,"k");band(136,150,"K","k");

    else{const y=Math.round(it.y);R2(x,y,10,10,"K");R2(x+1,y+1,8,8,"Q");R2(x+2,y+2,4,3,"q");}}
  else if(it.type==="bolt"){const x=Math.round(it.x-cx),y=Math.round(it.y);R2(x,y,8,6,"K");R2(x+1,y+1,6,4,frameT%8<4?"y":"q");R2(x+3,y,2,6,"Q");}
  else if(it.type==="wave"){const x=Math.round(it.x-cx),d=it.vx>0?1:-1,k=(45-it.t)/45;
    for(let a=0;a<3;a++){const ox=x+d*a*4,hh=6+a*4,c=a===1?"s":"W";R2(ox,it.y+8-hh,2,hh*2,c);R2(ox-d*2,it.y+8-hh-1,2,2,c);R2(ox-d*2,it.y+8+hh-1,2,2,c);}}
  else if(it.type==="treat")drawSpr(TREAT,it.x-cx,it.y+3,it.vx<0);}}

function drawPlayer(cx){if(P.hidden)return;if(P.inv>0&&Math.floor(P.inv/4)%2)return;
  const set=P.power?CH().fp:CH().f,f=pFrame(),x=P.x-cx-2,y=P.y+P.h-16,fl=P.face<0;
  if(P.sup>0&&(P.sup>120||frameT%8<4)){const g=CH().fg[f];
    if(G.char===1&&Math.abs(P.vx)>2.5){ctx.globalAlpha=.35;drawSpr(g,x-P.vx*5,y,fl);ctx.globalAlpha=.6;drawSpr(g,x-P.vx*2.5,y,fl);ctx.globalAlpha=1;}
    for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]])drawSpr(g,x+dx,y+dy,fl);}
  drawSpr(set[f],x,y,fl);
  if(P.power&&frameT%12<6)R2(P.x-cx+(P.face>0?-3:15),P.y+2+(frameT%24<12?0:6),1,1,"y");}

// A fonte não tem algumas maiúsculas acentuadas; troca pela letra sem acento
const ACC={"Ó":"O","Í":"I","Ê":"E","Ô":"O","Ú":"U","Á":"A","Â":"A","Õ":"O","À":"A"};
function txt(s,x,y,col="W",al="left",big){s=s.replace(/[ÓÍÊÔÚÁÂÕÀ]/g,c=>ACC[c]);ctx.font=big?FONT.replace("8px","16px"):FONT;ctx.textAlign=al;ctx.textBaseline="top";
  ctx.fillStyle=PAL.K;ctx.fillText(s,x+1,y+1);ctx.fillStyle=PAL[col];ctx.fillText(s,x,y);}
const pad=(n,l)=>String(Math.max(0,n)).padStart(l,"0");
function drawHUD(){
  txt("PONTOS",8,5,"y");txt(pad(G.score,6),8,15);
  txt("OSSOS",64,5,"y");ctx.drawImage(BONE_S.r,63,15);txt("x"+pad(G.bones,2),74,15);
  txt("VIDAS",112,5,"y");ctx.drawImage(HEART.r,111,15);txt("x"+G.lives,121,15);if(P&&P.power)ctx.drawImage(TREAT_S.r,140,15);
  if(P&&P.sup>0&&G.state==="play"){const C=CH(),w=Math.round(80*P.sup/SUPER_TIME);txt("SUPER "+C.sup,8,27,P.sup<120&&frameT%16<8?"W":"y");
    R2(8,37,82,5,"K");R2(9,38,w,3,"y");if(P.sup>SUPER_TIME-180)txt(C.supHint,8,46,"W");}
  if(LEVELS[G.level].boss){txt("CHEFE",160,5,"r");for(let i=0;i<5;i++){R2(160+i*9,15,8,8,"K");R2(161+i*9,16,6,6,boss&&!boss.dying&&i<boss.hp?"r":"Q");}}
  else{txt("FASE",160,5,"y");txt(String(G.level+1),176,15);}
  txt("TEMPO",208,5,"y");txt(pad(G.time,3),220,15,G.time<=50&&frameT%30<15?"r":"W");}

function drawPanel(x,y,w,h){ctx.fillStyle="rgba(11,11,26,.82)";ctx.fillRect(x,y,w,h);R2(x,y,w,1,"W");R2(x,y+h-1,w,1,"W");R2(x,y,1,h,"W");R2(x+w-1,y,1,h,"W");}

function drawWorld(){const cx=G.cam+(G.shake>0?(G.shake%4<2?2:-2):0);drawBG(theme===THEMES[0]?0:theme===THEMES[1]?1:2,cx);drawTiles(cx);drawHouse(cx);drawPlats(cx);drawItems(cx);drawEnts(cx);drawBoss(cx);drawPlayer(cx);
  if(G.crumbleOn&&G.crumble>cx-8){const vx=Math.round(G.crumble-cx);ctx.globalAlpha=.45;R2(0,0,Math.max(0,vx),H,"K");ctx.globalAlpha=1;
    for(let yy=0;yy<H;yy+=4){const j=(hash(yy+frameT*7)%5)-2;R2(vx+j,yy,2,4,(yy+frameT)%8<4?"r":"o");}}
  for(const p of parts)R2(p.x-cx,p.y,2,2,p.col);for(const p of pops)txt(p.s,p.x-cx,p.y,"W");}

const blink=()=>Math.floor(performance.now()/450)%2===0;
function drawDog(i,x,y,o={},t=0){const fr=o.pw?CHARS[i].fp:CHARS[i].f;let f=0,dy=0;
  if(o.run)f=Math.floor(t/7)%2;if(o.hop){const ph=Math.abs(Math.sin(t/9));dy=-Math.round(ph*7);f=ph>.2?2:0;}
  drawSpr(fr[f],x,y+dy,!!o.f);}
function render(){
  ctx.imageSmoothingEnabled=false;ctx.setTransform(1,0,0,1,0,0);const st=G.state,ox=Math.floor((W-256)/2);
  const ui=()=>ctx.setTransform(1,0,0,1,ox,0);
  if(st==="title"){
    drawBG(0,(performance.now()/40)%2000);for(let x=0;x<W;x+=16){ctx.drawImage(THEMES[0].top,x,208);ctx.drawImage(THEMES[0].fill,x,224);}
    ui();txt("AVENTURA DO",128,26,"W","center");txt("CARAMELO",128,40,"o","center",true);
    drawPanel(20,70,216,62);
    txt("SETAS OU A/D   ANDAR",30,78,"W");txt("ESPAÇO/W/CIMA  PULAR",30,90,"W");txt("ENTER/ESC      PAUSAR",30,102,"W");
    txt("PULE NOS GATOS E ROBÔS!",128,116,"y","center");
    const tt=performance.now()/16;for(let i=0;i<3;i++){ctx.save();ctx.translate(52+i*60,176);ctx.scale(2,2);
      const f=CHARS[i].f[Math.floor((tt+i*20)/10)%2];ctx.drawImage(f.r,-1,-1);ctx.restore();}
    if(G.secretT>0){drawPanel(24,140,208,20);txt(G.secretMsg,128,146,G.secretT%20<10?"y":"W","center");}
    else if(blink())txt(isTouch?"TOQUE EM START":"APERTE ENTER",128,148,"W","center");
    txt(isTouch?"":"F: TELA CHEIA",8,228,"b");txt("M: SOM",248,228,"b","right");return;}
  if(st==="select"){
    drawBG(0,200);ui();txt("ESCOLHA SEU CÃO",128,8,"W","center",true);const now=performance.now();
    for(let i=0;i<NCH;i++){const c=CHARS[i],x=9+i*34,y=30,sel=i===G.char,lk=!unlocked[i];
      drawPanel(x,y,32,42);if(sel){R2(x-1,y-1,34,2,"y");R2(x-1,y+41,34,2,"y");R2(x-1,y-1,2,44,"y");R2(x+31,y-1,2,44,"y");}
      const img=lk?c.sil[0]:c.f[sel?Math.floor(now/140)%2:0];const bob=sel&&!lk?-Math.round(Math.abs(Math.sin(now/160))*3):0;
      ctx.drawImage(img.r,1,1,16,16,x,y+6+bob,32,32);
      if(lk)txt("?",x+16,y+18,"W","center");}
    const c=CH(),lk=!unlocked[G.char];drawPanel(8,78,240,104);
    if(lk){txt("???",128,92,"W","center",true);txt("VENÇA O JOGO NO MODO",128,124,"W","center");
      txt(MODES[G.char-3][0],128,138,G.char===6?"r":"y","center");txt("PARA LIBERAR",128,152,"W","center");}
    else{const pw=Math.floor(now/1500)%2===1;
      txt(c.name,18,88,"y");txt(c.robot?"ROBÔ · ENGOLE GATOS":c.breed,18,100,c.robot?"g":"b");
      ctx.save();ctx.translate(196,84);ctx.scale(2,2);ctx.drawImage((pw?c.fp:c.f)[Math.floor(now/140)%2].r,0,0);ctx.restore();
      if(pw)txt("+PERNIL",212,124,"o","center");
      txt("VEL",18,116,"W");txt("PULO",18,128,"W");
      for(let k=0;k<3;k++){R2(56+k*10,116,8,8,"K");R2(57+k*10,117,6,6,k<c.vel?"o":"Q");R2(56+k*10,128,8,8,"K");R2(57+k*10,129,6,6,k<c.pulo?"g":"Q");}
      if(c.robot)txt("ASPIRADORES SÃO ALIADOS",18,140,"g");
      txt("1 PERNIL: "+c.form,18,c.robot?150:144,"o");txt("2 PERNIS: SUPER "+c.sup,18,c.robot?160:156,"y");txt(c.supHint,18,c.robot?170:166,"b");}
    drawPanel(8,188,240,18);txt(isTouch?"◀ ▶ ESCOLHE · START OK":"SETAS ESCOLHEM · ENTER OK",128,193,"W","center");return;}
  if(st==="mode"){
    drawBG(1,200);ui();txt("ESCOLHA O MODO",128,10,"W","center",true);
    MODES.forEach((m,i)=>{const y=30+i*38,sel=G.diff===i,u=3+i,c=CHARS[u];drawPanel(16,y,224,35);
      if(sel){R2(15,y-1,226,2,"y");R2(15,y+34,226,2,"y");R2(15,y-1,2,37,"y");R2(239,y-1,2,37,"y");}
      txt(m[0],26,y+4,sel?(i===3?"r":"y"):"W");txt(m[1],26,y+14,"b");txt(unlocked[u]?"LIBERADO: "+c.name:"PRÊMIO: CÃO SECRETO",26,y+24,unlocked[u]?"g":"o");
      ctx.drawImage((unlocked[u]?c.f[0]:c.sil[0]).r,212,y+9);});
    drawPanel(8,186,240,32);txt(isTouch?"◀ ▶ ESCOLHE · START OK":"SETAS · ENTER OK · ESC VOLTA",128,191,"W","center");
    txt("VENÇA E LIBERE O PRÊMIO",128,204,"b","center");return;}
  if(st==="card"){R2(0,0,W,H,"K");ui();const L=LEVELS[G.level];
    txt(L.boss?"CHEFÃO":"FASE "+(G.level+1),128,80,L.boss?"r":"W","center",true);
    if(L.boss)txt("PULE 5 VEZES NA CABEÇA DELE",128,120,"y","center");else if(CH().robot){txt("O CHÃO VAI DESMORONAR. CORRA!",128,120,"r","center");txt("CUIDADO: RACHADURAS E PEDRAS",128,132,"o","center");}txt("MODO "+MODES[G.diff][0],128,214,"b","center");txt(L.name+" · "+L.sub,128,104,"o","center");
    ctx.drawImage(HEART.r,100,136);txt("x "+G.lives,112,136,"W");ctx.drawImage(BONE_S.r,100,152);txt("x "+pad(G.bones,2),112,152,"W");
    txt(pad(G.score,6)+" PONTOS",128,176,"b","center");
    txt("VIDA EXTRA EM "+(BONES_PER_LIFE*(G.lifeMark+1)-G.bones)+" OSSOS",128,196,"Q","center");
    drawDog(G.char,120,44,{});return;}
  drawWorld();ui();drawHUD();
  if(st==="pause"){drawPanel(52,72,152,92);txt("PAUSA",128,82,"W","center",true);
    ["CONTINUAR","MENU INICIAL"].forEach((o,i)=>{const sel=G.pauseSel===i;txt((sel?"> ":"  ")+o,72,110+i*16,sel?"y":"W");});
    txt(isTouch?"◀ ▶ ESCOLHE · PULO OK":"SETAS · ENTER OK",128,150,"b","center");}
  if(st==="clear"){drawPanel(40,72,176,52);txt("CASINHA!",128,82,"y","center",true);txt("BÔNUS DE TEMPO",128,106,"W","center");}
  if(st==="over"){ctx.setTransform(1,0,0,1,0,0);R2(0,0,W,H,"K");ui();txt("FIM DE JOGO",128,84,"r","center",true);txt("PAROU NA FASE "+(G.level+1)+" · "+LEVELS[G.level].name,128,112,"W","center");
    txt(pad(G.snap.score,6)+" PONTOS",128,128,"b","center");txt("A JORNADA RECOMEÇA",128,156,"W","center");
    if(blink())txt((isTouch?"START":"ENTER")+": VOLTAR À FASE 1",128,172,"y","center");}
  if(st==="win"){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="rgba(11,11,26,.7)";ctx.fillRect(0,0,W,H);ui();drawPanel(24,44,208,150);
    txt("VITÓRIA!",128,54,"y","center",true);txt(CH().name+" · "+MODES[G.diff][0],128,76,"o","center");txt(CH().robot?"CHEFÃO DERROTADO!":"MISSÃO CUMPRIDA!",128,88,"W","center");
    txt("PONTOS  "+pad(G.score,6),128,104,"W","center");txt("OSSOS   "+pad(G.bones,6),128,116,"W","center");
    const nu=G.newUnlock;if(nu>=0){txt("NOVO CÃO LIBERADO:",128,132,"y","center");txt(CHARS[nu].name,128,142,"g","center");}
    drawDog(G.char,nu>=0?100:120,160,{hop:1,pw:1},performance.now()/16);if(nu>=0)drawDog(nu,140,160,{hop:1,f:1},performance.now()/16+20);
    if(blink())txt(isTouch?"START: JOGAR DE NOVO":"ENTER: JOGAR DE NOVO",128,182,"y","center");
    if(frameT%3===0)parts.push({x:G.cam+Math.random()*W,y:-4,vx:(Math.random()-.5),vy:1,t:200,col:["y","r","o","W","s"][frameT%5]});}}

let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(250,now-last);last=now;
  while(acc>=STEP){update();acc-=STEP;}
  try{render();}catch(e){console.error(e);}requestAnimationFrame(frame);}
loadLevel(0);
const go=()=>requestAnimationFrame(t=>{last=t;frame(t);});
if(document.fonts&&document.fonts.load)document.fonts.load(FONT).then(go,go);else go();
})();
</script>
